<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback для GitHub Pages (BrowserRouter)
      // Переносимо поточний шлях у query і редіректимо на корінь репо
      var repo = "/diploma_logistics_project";
      var l = window.location;
      var path = l.pathname.replace(repo, "");
      var search = l.search ? "&" + l.search.slice(1) : "";
      var hash = l.hash ? "&" + l.hash.slice(1) : "";
      l.replace(repo + "/?p=" + encodeURIComponent(path) + search + hash);
    </script>
  </head>
  <body></body>
</html>
